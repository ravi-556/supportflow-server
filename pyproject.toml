[tool.ruff]
line-length = 119
target-version = "py312"
# migrations are autogenerated, never hand-edited (see CLAUDE.md); .claude
# holds skill/agent docs whose embedded code fences are illustrative
# snippets, not this project's source — ruff must never reformat either.
exclude = ["**/migrations/*.py", ".claude"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]
ignore = [
    "E501",  # line length is enforced by the formatter, not worth a hard error
]
# flake8-django (DJ) deliberately not enabled: DJ001 (no null=True on CharField)
# and DJ008 (every model needs __str__) both fight this codebase's actual,
# already-reviewed conventions (optional CharFields do use null=True; not
# every model needs a __str__). Revisit per-rule if that convention changes.

[tool.ruff.lint.isort]
known-first-party = ["apps", "supportflow"]

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = ["*/migrations", ".venv", ".claude"]
# B105/B107 (hardcoded_password_string/_default) are naive substring matches
# on words like "password"/"bearer" — every hit in this codebase today is a
# false positive: the OAuth token_type value "bearer" (not a password) and
# deliberate test-fixture passwords in apps/accounts/tests.py. Real secrets
# here go through bcrypt (security.py) or settings.py's os.environ[...],
# neither of which bandit flags.
skips = ["B105", "B107"]
